<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>404 — сторінку не знайдено | ДентаЛюкс</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0}
    body{
      font-family:"Manrope",system-ui,sans-serif;color:#0c2a2e;
      min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;
      background:linear-gradient(180deg,#eefcfb,#ffffff);
    }
    .wrap{max-width:520px}
    .mark{
      width:150px;height:150px;border-radius:50%;margin:0 auto 24px;display:grid;place-items:center;
      background:#d3f6f3;box-shadow:0 18px 50px rgba(10,122,117,.18);
    }
    .mark img{width:104px;height:104px;display:block}
    .code{font-family:"Unbounded",sans-serif;font-size:clamp(4.5rem,16vw,8rem);line-height:1;color:#0fb9b1;letter-spacing:-.04em}
    h1{font-family:"Unbounded",sans-serif;font-size:1.5rem;margin:8px 0 12px;letter-spacing:-.02em}
    p{color:#5f7b7e;font-size:1.05rem;margin-bottom:30px}
    .ru{display:block;font-size:.92rem;color:#90a9ab;margin-top:6px}
    .btn{
      display:inline-flex;align-items:center;gap:10px;padding:15px 28px;border-radius:100px;font-weight:700;color:#fff;
      background:linear-gradient(135deg,#0fb9b1,#0a9a93);box-shadow:0 18px 50px rgba(10,122,117,.18);
      text-decoration:none;transition:transform .2s ease
    }
    .btn:hover{transform:translateY(-3px)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark" aria-hidden="true">
      <img src="assets/img/tooth-mascot.png" width="104" height="104" alt="" />
    </div>
    <div class="code">404</div>
    <h1>Сторінку не знайдено<span class="ru">Страница не найдена</span></h1>
    <p>На жаль, такої сторінки не існує або її було переміщено.<span class="ru">К сожалению, такой страницы не существует или она была перемещена.</span></p>
    <a class="btn" href="./">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8"/><path d="M9 22V12h6v10"/></svg>
      На головну / На главную
    </a>
  </div>
</body>
</html>
